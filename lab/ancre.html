<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ancre — Pierre Duchesne</title>
  <link rel="stylesheet" href="../style.css?v=7" />
  <link rel="stylesheet" href="lab.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
</head>
<body data-root=".." data-page="lab">
  <div id="site-header"></div>
  <main>
    <section class="lab-page">
      <div class="lab-content">
        <span class="lab-eyebrow">Fragment</span>
        <h1 class="lab-heading">Tout est<br>dans le fragment.</h1>
        <p class="lab-body">
          Une adresse web peut avoir une dernière partie — après le <code style="font-family:var(--font-mono);font-size:0.85em;color:var(--primary);">#</code>.
          On l'appelle le fragment, l'ancre. Elle est lue par le navigateur,
          pas par le serveur. Et parfois, une page lui prête attention.
        </p>
        <p id="fragment-hint" class="lab-body" style="font-family: var(--font-mono); font-size: 0.8rem;">
          essaie : #actif
        </p>
        <p id="fragment-reveal" style="display:none; font-family: var(--font-mono); color: var(--primary); font-size: 1rem; letter-spacing: 0.05em;"></p>
      </div>
      <form class="lab-form" id="answer-form" autocomplete="off">
        <input class="lab-input" type="text" id="answer-input" placeholder="···" autocomplete="off" spellcheck="false" aria-label="Réponse" />
        <button class="lab-btn" type="submit" aria-label="Valider">→</button>
      </form>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    function checkHash() {
      if (window.location.hash === '#actif') {
        var r = document.getElementById('fragment-reveal');
        var h = document.getElementById('fragment-hint');
        if (r) { r.style.display = 'block'; r.textContent = 'leurre'; }
        if (h) { h.style.display = 'none'; }
      }
    }
    window.addEventListener('hashchange', checkHash);
    checkHash();
  </script>
  <script src="lab.js"></script>
  <script src="../shared-layout.js?v=6"></script>
</body>
</html>

        <h1 class="lab-heading">Certaines choses<br>existent sans se montrer.</h1>
        <p class="lab-body">
          Un jardin n'est pas fait que de ce qui dépasse la terre.
          Les racines, les graines dormantes, les galeries souterraines —
          tout cela est là, invisible, mais bien présent.
        </p>

<!DOCTYPE html>

  <div id="site-header"></div>

    <section class="lab-page">
      <div class="lab-content">
        <span class="lab-eyebrow">Meta</span>
        <h1 class="lab-heading">Tu en es à quelle<br>énigme, exactement ?</h1>
        <p class="lab-body">
          Si tu as tout suivi depuis le début, tu le sais.
          Si tu t'es perdu en route, compte — ou cherche un indice
          dans ce que tu as devant les yeux.
        </p>
        <p class="lab-body" style="font-style: italic; color: var(--text-muted);">
          La réponse est un nombre — écrit en toutes lettres.
        </p>
      </div>
      <form class="lab-form" id="answer-form" autocomplete="off">
        <input class="lab-input" type="text" id="answer-input" placeholder="···" autocomplete="off" spellcheck="false" aria-label="Réponse" />
        <button class="lab-btn" type="submit" aria-label="Valider">→</button>
      </form>
    </section>
  </main>
  <div id="site-footer"></div>

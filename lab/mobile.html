<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mobile — Pierre Duchesne</title>
  <link rel="stylesheet" href="../style.css?v=7" />
  <link rel="stylesheet" href="lab.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
</head>
<body data-root=".." data-page="lab">
  <div id="site-header"></div>
  <main>
    <section class="lab-page">
      <div class="lab-content">
        <span class="lab-eyebrow">Paramètres</span>
        <h1 class="lab-heading">Une adresse<br>peut avoir des clés.</h1>
        <p class="lab-body">
          Les URLs ne sont pas que des chemins. Elles peuvent transporter
          des paramètres, des instructions, des modes.
          Quelque chose change quand on ajoute le bon paramètre à cette adresse.
        </p>
        <p class="lab-body">
          <span id="hint-text" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted-foreground);">
            essaie : ?mode=actif
          </span>
        </p>
        <p id="revealed" style="display:none; font-family: var(--font-mono); color: var(--primary); font-size: 1rem; letter-spacing: 0.05em;"></p>
      </div>
      <form class="lab-form" id="answer-form" autocomplete="off">
        <input class="lab-input" type="text" id="answer-input" placeholder="···" autocomplete="off" spellcheck="false" aria-label="Réponse" />
        <button class="lab-btn" type="submit" aria-label="Valider">→</button>
      </form>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get('mode') === 'actif') {
        var r = document.getElementById('revealed');
        var h = document.getElementById('hint-text');
        if (r) { r.style.display = 'block'; r.textContent = 'cle'; }
        if (h) { h.style.display = 'none'; }
      }
    })();
  </script>
  <script src="lab.js"></script>
  <script src="../shared-layout.js?v=6"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konami — Pierre Duchesne</title>
  <link rel="stylesheet" href="../style.css?v=7" />
  <link rel="stylesheet" href="lab.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
</head>
<body data-root=".." data-page="lab">
  <div id="site-header"></div>
  <main>
    <section class="lab-page">
      <div class="lab-content">
        <span class="lab-eyebrow">Ordre</span>
        <h1 class="lab-heading">Quatre éléments.<br>Un ordre précis.</h1>
        <p class="lab-body">
          Chaque élément a sa place. Pas celle qu'il occupe visuellement —
          celle qu'on lui a assignée. Pour trouver l'ordre correct,
          il faut regarder ce qui est attaché à chacun d'eux.
        </p>
        <div class="lab-tiles" id="tile-container">
          <div class="lab-tile" data-order="3" data-symbol="◇">◇</div>
          <div class="lab-tile" data-order="1" data-symbol="△">△</div>
          <div class="lab-tile" data-order="4" data-symbol="○">○</div>
          <div class="lab-tile" data-order="2" data-symbol="□">□</div>
        </div>
      </div>
      <form class="lab-form" id="answer-form" autocomplete="off">
        <input class="lab-input" type="text" id="answer-input" placeholder="···" autocomplete="off" spellcheck="false" aria-label="Réponse" />
        <button class="lab-btn" type="submit" aria-label="Valider">→</button>
      </form>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    (function () {
      var expected = [1, 2, 3, 4];
      var clicked = [];
      var tiles = document.querySelectorAll('.lab-tile');
      tiles.forEach(function (tile) {
        tile.addEventListener('click', function () {
          var order = parseInt(tile.dataset.order);
          var step = clicked.length;
          if (order === expected[step]) {
            clicked.push(order);
            tile.classList.add('active');
            if (clicked.length === 4) {
              tiles.forEach(function (t) { t.classList.remove('active'); t.classList.add('done'); });
              setTimeout(function () {
                document.getElementById('answer-input').value = 'sequence';
              }, 300);
            }
          } else {
            clicked = [];
            tiles.forEach(function (t) { t.classList.remove('active', 'done'); });
          }
        });
      });
    })();
  </script>
  <script src="lab.js"></script>
  <script src="../shared-layout.js?v=6"></script>
</body>
</html>

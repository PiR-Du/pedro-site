<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reflet — Pierre Duchesne</title>
  <link rel="stylesheet" href="../style.css?v=7" />
  <link rel="stylesheet" href="lab.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
</head>
<body data-root=".." data-page="lab">
  <div id="site-header"></div>
  <main>
    <section class="lab-page">
      <div class="lab-content">
        <span class="lab-eyebrow">Interaction</span>
        <h1 class="lab-heading">Quelque chose<br>attend d'être pressé.</h1>
        <p class="lab-body">
          Sur cette page se trouve un bouton.
          Tu ne le vois peut-être pas.
          Mais il est là.
        </p>
        <div style="position: relative; height: 100px; margin: 1.5rem 0;">
          <button
            id="secret-btn"
            style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                   width: 80px; height: 80px; background: transparent; border: none;
                   cursor: pointer; opacity: 0.012; border-radius: 50%;"
            aria-label="bouton"
          ></button>
        </div>
        <p id="btn-reveal" style="display:none; font-family: var(--font-mono); color: var(--primary); font-size: 1rem; letter-spacing: 0.05em; text-align: center;">portail</p>
      </div>
      <form class="lab-form" id="answer-form" autocomplete="off">
        <input class="lab-input" type="text" id="answer-input" placeholder="···" autocomplete="off" spellcheck="false" aria-label="Réponse" />
        <button class="lab-btn" type="submit" aria-label="Valider">→</button>
      </form>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    document.getElementById('secret-btn').addEventListener('click', function () {
      document.getElementById('btn-reveal').style.display = 'block';
    });
  </script>
  <script src="lab.js"></script>
  <script src="../shared-layout.js?v=6"></script>
</body>
</html>

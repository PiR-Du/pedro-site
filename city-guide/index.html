<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Que faire en ville ? — Pierre Duchesne</title>
  <meta name="description" content="Sélection de bonnes adresses avec carte interactive et filtres par ambiance." />
  <link rel="stylesheet" href="../style.css?v=3" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
</head>
<body data-root=".." data-page="city-guide">

  <div id="site-header"></div>

  <main>
    <section class="hero">
      <div class="grid-bg" aria-hidden="true"></div>
      <div class="inner">
        <p class="eyebrow">./projets/que-faire-en-ville</p>
        <h1>Bonnes adresses & <span class="text-gradient">sorties</span>.</h1>
        <p class="lead">Bars, restaurants, expos... le meilleur de la ville testé et approuvé.</p>
      </div>
    </section>

    <div class="media-controls">
        <div class="filter-bar">
            <div class="filter-group">
                <label>Type</label>
                <select id="filter-type">
                    <option value="all">Tous les lieux</option>
                    <option value="Restaurant">Restaurant</option>
                    <option value="Bar">Bar</option>
                    <option value="Lieu culturel">Lieu culturel</option>
                </select>
            </div>

            <div id="contextual-filters" class="contextual-filters">
                <div class="filter-group">
                    <label>Genre</label>
                    <select id="filter-genre">
                        <option value="all">Tout voir</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Ambiance</label>
                    <select id="filter-ambiance">
                        <option value="all">Tout voir</option>
                    </select>
                </div>
            </div>

            <div class="filter-group">
                <label>Par qui ?</label>
                <select id="filter-contributor">
                    <option value="all">Tout le monde</option>
                </select>
            </div>

            <div class="search-box">
                <input type="text" id="city-search" placeholder="Chercher un lieu, une adresse...">
            </div>
        </div>
    </div>

    <div id="main-grid" class="media-grid">
        <!-- Rempli par app.js -->
    </div>
  </main>

  <!-- Drawer de Détail -->
  <div id="detail-drawer" class="drawer">
    <div class="drawer-overlay" onclick="closeDrawer()"></div>
    <div class="drawer-panel">
        <button class="drawer-close" onclick="closeDrawer()">×</button>
        <div id="drawer-content" class="drawer-inner"></div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="../shared-layout.js?v=3"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>

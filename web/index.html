<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sites web à découvrir, Pierre Duchesne</title>
  <meta name="description" content="Sélection de sites qui valent le détour : portfolios, outils, inspirations, expériences web.">
  <meta property="og:title" content="Sites web à découvrir">
  <meta property="og:description" content="Une liste de sites qui valent le détour, triés par catégorie.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#efefec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
</head>

<body data-page="web" data-root="..">
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <site-header>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-header__brand" href="../index.html">Pierre Duchesne</a>
        <a class="link text-sm" href="../index.html#outils">Sommaire</a>
      </div>
    </header>
  </site-header>

  <main id="contenu">
    <header class="page-head">
      <div class="container grid">
        <div class="grid__band grid--baseline">
          <span class="folio sm-col-1-2 md-col-1-2 col-1-2">07</span>
          <span class="eyebrow sm-col-3-4 md-col-5-8 col-10-12 align-end">Découvrir</span>
        </div>
        <hr class="rule rule--strong col-1-12" data-reveal>
        <h1 class="title-1 col-1-7 md-col-1-6">Sites web à découvrir</h1>
        <p class="lead col-8-12 md-col-1-6">Les sites qui valent le détour : portfolios, outils, inspirations, expériences.</p>
      </div>
    </header>

    <div class="tool">
      <div class="container grid">
        <aside class="tool__aside tool__aside--sticky col-1-3 md-col-1-3" aria-label="Filtres">
          <div class="field">
            <label class="label" for="web-search">Rechercher</label>
            <input class="input" type="search" id="web-search" placeholder="Nom, description, tag">
          </div>

          <div class="field">
            <span class="label" id="category-label">Catégorie</span>
            <div class="chip-group" id="category-filter" role="group" aria-labelledby="category-label"></div>
          </div>

          <details class="disclosure">
            <summary class="disclosure__summary">Proposer un site</summary>
            <form class="disclosure__body" data-contribute="cool-web" data-label-field="name" novalidate>
              <div class="field">
                <label class="label" for="wf-contributor">Votre nom</label>
                <input class="input" type="text" id="wf-contributor" name="contributor" data-default="Anonyme" autocomplete="given-name" placeholder="Pierre">
              </div>
              <div class="field">
                <label class="label" for="wf-name">Nom du site</label>
                <input class="input" type="text" id="wf-name" name="name" required placeholder="Pudding.cool">
              </div>
              <div class="field">
                <label class="label" for="wf-url">Adresse</label>
                <input class="input" type="url" id="wf-url" name="url" required placeholder="https://">
              </div>
              <div class="field">
                <label class="label" for="wf-category">Catégorie</label>
                <input class="input" type="text" id="wf-category" name="category" data-default="Divers" placeholder="Inspiration, outil, portfolio">
              </div>
              <div class="field">
                <label class="label" for="wf-tags">Tags <span class="label__optional">(séparés par des virgules)</span></label>
                <input class="input" type="text" id="wf-tags" name="tags" data-split>
              </div>
              <div class="field">
                <label class="label" for="wf-description">Pourquoi il vaut le détour</label>
                <textarea class="textarea" id="wf-description" name="description" placeholder="Ce qui le rend spécial"></textarea>
              </div>
              <button class="btn btn--primary btn--block" type="submit">Proposer</button>
              <p class="hint">Envoyé à Pierre, intégré manuellement.</p>
            </form>
          </details>
        </aside>

        <div class="tool__main col-4-12 md-col-4-8">
          <p class="eyebrow" id="web-count" role="status"></p>
          <ul class="results" id="web-grid" aria-label="Résultats"></ul>
          <noscript><p class="empty">La liste des sites nécessite JavaScript.</p></noscript>
        </div>
      </div>
    </div>
  </main>

  <dialog class="drawer" id="detail-drawer" aria-labelledby="drawer-title" data-dismissable>
    <div class="drawer__bar">
      <button type="button" class="btn btn--sm" data-close-dialog>Fermer</button>
    </div>
    <div class="drawer__content"></div>
  </dialog>

  <site-footer>
    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p>© 2026 Pierre Duchesne</p>
        <p class="eyebrow">Data · Maths · Code</p>
      </div>
    </footer>
  </site-footer>

  <script src="../js/site.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>

</html>

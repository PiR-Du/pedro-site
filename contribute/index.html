<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contribuer — Pierre Duchesne</title>
    <meta name="description" content="Partagez vos recommandations culturelles, vos bonnes adresses ou vos connaissances — elles seront ajoutées au site." />
    <meta property="og:title" content="Contribuer au site" />
    <meta property="og:description" content="Ajoutez vos recommandations à la Médiathèque, à l'Encyclopédie ou au guide de la ville." />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="../style.css?v=3" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
</head>

<body data-page="contribute" data-root="..">
    <div id="site-header"></div>

    <!-- Inline toast for this page -->
    <div id="contribute-toasts" aria-live="polite" aria-atomic="true"
        style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:200;display:flex;flex-direction:column;gap:0.5rem;"></div>

    <main class="contribute-shell">
        <div class="main-content">
            <div class="section-head" style="text-align:left;align-items:flex-start;margin-bottom:2rem;">
                <p class="eyebrow">./contribuer</p>
                <h1 style="font-family:var(--font-serif);font-size:clamp(2rem,5vw,3rem);line-height:1.1;letter-spacing:-0.02em;margin-top:0.5rem;">
                    Partager une recommandation
                </h1>
                <p class="lead" style="color:var(--muted-foreground);margin-top:0.75rem;max-width:42rem;">
                    Remplissez le formulaire, ajoutez autant d'entrées que vous voulez, puis envoyez tout en une fois. Pierre les intégrera manuellement au site.
                </p>
            </div>

            <div class="form-card">
                <div class="type-selector" role="group" aria-label="Type de contribution">
                    <button class="type-btn active" onclick="setTool('encyclopedia')" aria-pressed="true">Encyclopédie</button>
                    <button class="type-btn" onclick="setTool('recommendation')" aria-pressed="false">Médiathèque</button>
                    <button class="type-btn" onclick="setTool('city-guide')" aria-pressed="false">Que faire en ville</button>
                    <button class="type-btn" onclick="setTool('batch-cooking')" aria-pressed="false">Batch Cooking</button>
                </div>

                <form id="unified-form" novalidate>
                    <!-- Global Identity -->
                    <div class="form-group"
                        style="border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem;">
                        <label for="contributor-name">Votre Nom / Pseudo</label>
                        <input type="text" id="contributor-name" placeholder="Qui envoie cette info ?">
                    </div>

                    <!-- Encyclopedia Fields -->
                    <div id="fields-encyclopedia">
                        <div class="form-group">
                            <label for="enc-title">Titre du savoir</label>
                            <input type="text" id="enc-title" placeholder="ex: Effet Dunning-Kruger">
                        </div>
                        <div class="form-group">
                            <label for="enc-text">Contenu / Explication</label>
                            <textarea id="enc-text" rows="4" placeholder="Expliquez ce savoir..."></textarea>
                        </div>
                        <div class="grid-2">
                            <div class="form-group">
                                <label for="enc-category">Catégorie</label>
                                <input type="text" id="enc-category" placeholder="ex: Psychologie">
                            </div>
                        </div>
                    </div>

                    <!-- Recommendation Fields -->
                    <div id="fields-recommendation" class="hidden">
                        <div class="form-group">
                            <label for="rec-type">Quel type de média ?</label>
                            <select id="rec-type" onchange="adaptMuseForm()">
                                <option value="Film">Film</option>
                                <option value="Série">Série</option>
                                <option value="Livre">Livre</option>
                                <option value="Musique">Musique</option>
                                <option value="Jeu Vidéo">Jeu Vidéo</option>
                                <option value="Jeu de Société">Jeu de Société</option>
                            </select>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label id="label-rec-title" for="rec-title">Titre</label>
                                <input type="text" id="rec-title" placeholder="Nom de l'œuvre">
                            </div>
                            <div class="form-group">
                                <label id="label-rec-creator" for="rec-creator">Créateur</label>
                                <input type="text" id="rec-creator" placeholder="Auteur, Réalisateur...">
                            </div>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label for="rec-public">Public</label>
                                <select id="rec-public">
                                    <option value="Solo">Solo</option>
                                    <option value="Groupe">Groupe / Amis</option>
                                    <option value="Famille">Famille</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label for="rec-genre">Genre Principal</label>
                                <input type="text" id="rec-genre" placeholder="Fantasy, Rock, SF...">
                            </div>
                            <div class="form-group">
                                <label for="rec-subgenres">Sous-genres</label>
                                <input type="text" id="rec-subgenres" placeholder="Tags séparés par virgules">
                            </div>
                        </div>

                        <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label id="label-rec-duration" for="rec-duration">Durée</label>
                                <input type="text" id="rec-duration" placeholder="ex: 2h 30m, 400p">
                            </div>
                            <div class="form-group">
                                <label for="rec-complexity">Complexité (1–5) : <span id="complexity-val">3</span></label>
                                <input type="range" id="rec-complexity" min="1" max="5" value="3"
                                    oninput="document.getElementById('complexity-val').textContent=this.value">
                            </div>
                        </div>

                        <div class="form-group" id="group-rec-platform" style="display: none;">
                            <label for="rec-platform">Plateforme (Netflix, Prime, etc.)</label>
                            <input type="text" id="rec-platform" placeholder="Où peut-on le trouver ?">
                        </div>

                        <div class="form-group">
                            <label for="rec-pitch">Pitch court</label>
                            <textarea id="rec-pitch" rows="2" placeholder="De quoi s'agit-il ?"></textarea>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label for="rec-emotion">Émotion principale</label>
                                <input type="text" id="rec-emotion" placeholder="Relaxant, intense, triste...">
                            </div>
                            <div class="form-group">
                                <label for="rec-ambiance">Ambiance</label>
                                <input type="text" id="rec-ambiance" placeholder="Cozy, dark, épique...">
                            </div>
                        </div>
                    </div>

                    <!-- City Guide Fields -->
                    <div id="fields-city-guide" class="hidden">
                        <div class="form-group">
                            <label for="city-type">Type de lieu</label>
                            <select id="city-type">
                                <option value="Restaurant">Restaurant</option>
                                <option value="Bar">Bar</option>
                                <option value="Lieu culturel">Lieu culturel</option>
                            </select>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label for="city-title">Nom du lieu</label>
                                <input type="text" id="city-title" placeholder="ex: Le Perchoir">
                            </div>
                            <div class="form-group">
                                <label for="city-address">Adresse</label>
                                <input type="text" id="city-address" placeholder="ex: 14 Rue Crespin du Gast, 75011 Paris">
                            </div>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label for="city-genre">Genre / Style</label>
                                <input type="text" id="city-genre" placeholder="ex: Rooftop, Gastronomique...">
                            </div>
                            <div class="form-group">
                                <label for="city-ambiance">Ambiance</label>
                                <input type="text" id="city-ambiance" placeholder="ex: Chill, Épuré, Animé...">
                            </div>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label for="city-emotion">Émotion</label>
                                <input type="text" id="city-emotion" placeholder="ex: Détente, Émerveillement...">
                            </div>
                            <div class="form-group">
                                <label for="city-public">Public conseillé</label>
                                <select id="city-public">
                                    <option value="Amis">Amis</option>
                                    <option value="Couple">Couple</option>
                                    <option value="Famille">Famille</option>
                                    <option value="Solo">Solo</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="city-pitch">Description / Pourquoi y aller ?</label>
                            <textarea id="city-pitch" rows="2" placeholder="Un court texte sur ce qui rend ce lieu spécial..."></textarea>
                        </div>
                    </div>

                    <!-- Batch Cooking Fields -->
                    <div id="fields-batch-cooking" class="hidden">
                        <div class="form-group">
                            <label for="bc-title">Nom du plat</label>
                            <input type="text" id="bc-title" placeholder="ex: Lasagnes">
                        </div>
                        <div class="form-group">
                            <label for="bc-ingredients">Ingrédients (séparés par virgules)</label>
                            <textarea id="bc-ingredients" rows="3" placeholder="ex: pâtes, tomates, boeuf..."></textarea>
                        </div>
                    </div>

                    <button type="button" class="submit-btn" onclick="generateContribution()">
                        Ajouter à la liste →
                    </button>
                </form>
            </div>
        </div>

        <aside class="queue-card" aria-label="Boîte d'envoi">
            <div class="queue-title">
                <span id="queue-count-label">Boîte d'envoi</span>
                <div style="display:flex; gap: 0.5rem;">
                    <button class="btn btn-ghost btn-sm" onclick="downloadQueue()"
                        style="font-size: 0.6rem; border: 1px solid var(--border);" aria-label="Exporter en JSON">Export</button>
                    <button class="btn btn-ghost btn-sm" onclick="clearQueue()"
                        style="font-size: 0.6rem; border: 1px solid var(--border);" aria-label="Vider la file">Vider</button>
                </div>
            </div>
            <button id="formspree-btn" class="submit-btn" onclick="sendViaFormspree()"
                style="background: var(--primary); margin-bottom: 1rem; font-size: 0.85rem;">
                Envoyer à Pierre →
            </button>

            <div id="contribution-queue" aria-live="polite">
                <!-- Items will appear here -->
            </div>
        </aside>
    </main>

    <div id="site-footer"></div>

    <script src="../shared-layout.js?v=3"></script>
    <script>
        let currentTool = 'encyclopedia';
        let queue = JSON.parse(localStorage.getItem('pending_contributions') || '[]');

        // ── Toast utility (no alert()) ──────────────────────────────
        function notify(msg, type = 'default') {
            const c = document.getElementById('contribute-toasts');
            const t = document.createElement('div');
            t.className = 'toast' + (type === 'success' ? ' toast-success' : type === 'error' ? ' toast-event' : '');
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 3200);
        }

        // ── Tool selector ───────────────────────────────────────────
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.type-btn').forEach(btn => {
                const map = { encyclopedia: 'encyclo', recommendation: 'média', 'city-guide': 'ville', 'batch-cooking': 'cooking' };
                const active = btn.innerText.toLowerCase().includes(map[tool] || tool);
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-pressed', active ? 'true' : 'false');
            });
            ['encyclopedia', 'recommendation', 'city-guide', 'batch-cooking'].forEach(id => {
                document.getElementById(`fields-${id}`).classList.toggle('hidden', id !== tool);
            });
            if (tool === 'recommendation') adaptMuseForm();
        }

        function adaptMuseForm() {
            const type = document.getElementById('rec-type').value;
            const labelTitle = document.getElementById('label-rec-title');
            const creatorGroup = document.getElementById('label-rec-creator').closest('.form-group');
            const creatorInput = document.getElementById('rec-creator');
            const durationInput = document.getElementById('rec-duration');
            const labelDuration = document.getElementById('label-rec-duration');

            const config = {
                'Film':           { title: "Titre du film",            creator: "Réalisateur",          placeholder: "ex: Christopher Nolan", dur: "Durée",           durPh: "ex: 2h 15m",   showCreator: true },
                'Série':          { title: "Titre de la série",         creator: "Showrunner / Chaîne",  placeholder: "ex: HBO",               dur: "Saisons / Éps",   durPh: "ex: 5 saisons",showCreator: true },
                'Livre':          { title: "Titre du livre",            creator: "Auteur",               placeholder: "ex: Albert Camus",      dur: "Pages",           durPh: "ex: 350p",     showCreator: true },
                'Musique':        { title: "Titre de l'album / morceau",creator: "Artiste / Groupe",     placeholder: "ex: Pink Floyd",         dur: "Format",          durPh: "ex: Album",    showCreator: true },
                'Jeu Vidéo':      { title: "Nom du jeu",                creator: "Studio",               placeholder: "ex: FromSoftware",       dur: "Temps de jeu",    durPh: "ex: 40h",      showCreator: false },
                'Jeu de Société': { title: "Nom du jeu de société",     creator: "Auteur / Éditeur",     placeholder: "ex: Antoine Bauza",     dur: "Partie moyenne",  durPh: "ex: 45m",      showCreator: false }
            };

            const c = config[type];
            labelTitle.textContent = c.title;
            labelDuration.textContent = c.dur;
            durationInput.placeholder = c.durPh;
            creatorGroup.style.display = c.showCreator ? '' : 'none';
            if (!c.showCreator) creatorInput.value = '';
            else { document.getElementById('label-rec-creator').textContent = c.creator; creatorInput.placeholder = c.placeholder; }

            const platformGroup = document.getElementById('group-rec-platform');
            platformGroup.style.display = (type === 'Film' || type === 'Série') ? 'block' : 'none';
            if (type !== 'Film' && type !== 'Série') document.getElementById('rec-platform').value = '';
        }

        // ── Generate contribution ───────────────────────────────────
        function generateContribution() {
            const contributor = document.getElementById('contributor-name').value.trim() || 'Anonyme';
            let item = { timestamp: new Date().toISOString(), tool: currentTool, data: { contributor } };

            if (currentTool === 'encyclopedia') {
                const title = document.getElementById('enc-title').value.trim();
                if (!title) { notify('Le titre est obligatoire.', 'error'); document.getElementById('enc-title').focus(); return; }
                Object.assign(item.data, {
                    title,
                    text: document.getElementById('enc-text').value,
                    category: document.getElementById('enc-category').value,
                    source: contributor
                });
            } else if (currentTool === 'recommendation') {
                const title = document.getElementById('rec-title').value.trim();
                if (!title) { notify('Le titre est obligatoire.', 'error'); document.getElementById('rec-title').focus(); return; }
                Object.assign(item.data, {
                    id: 'u' + Date.now().toString().slice(-6),
                    type: document.getElementById('rec-type').value,
                    title,
                    creator: document.getElementById('rec-creator').value,
                    main_genre: document.getElementById('rec-genre').value,
                    sub_genres: document.getElementById('rec-subgenres').value.split(',').map(s => s.trim()).filter(Boolean),
                    duration: document.getElementById('rec-duration').value,
                    main_emotion: document.getElementById('rec-emotion').value,
                    complexity: parseInt(document.getElementById('rec-complexity').value),
                    ambiance: document.getElementById('rec-ambiance').value,
                    public: document.getElementById('rec-public').value,
                    pitch: document.getElementById('rec-pitch').value
                });
                const platform = document.getElementById('rec-platform').value;
                if (platform) item.data.platform = platform;
            } else if (currentTool === 'city-guide') {
                const title = document.getElementById('city-title').value.trim();
                if (!title) { notify('Le nom du lieu est obligatoire.', 'error'); document.getElementById('city-title').focus(); return; }
                Object.assign(item.data, {
                    id: 'v' + Date.now().toString().slice(-6),
                    type: document.getElementById('city-type').value,
                    title,
                    address: document.getElementById('city-address').value,
                    main_genre: document.getElementById('city-genre').value,
                    sub_genres: [],
                    main_emotion: document.getElementById('city-emotion').value,
                    ambiance: document.getElementById('city-ambiance').value,
                    public: document.getElementById('city-public').value,
                    pitch: document.getElementById('city-pitch').value
                });
            } else {
                const title = document.getElementById('bc-title').value.trim();
                if (!title) { notify('Le nom du plat est obligatoire.', 'error'); document.getElementById('bc-title').focus(); return; }
                Object.assign(item.data, {
                    id: Math.floor(Math.random() * 1000) + 1000,
                    title,
                    ingredients: document.getElementById('bc-ingredients').value.split(',').map(s => s.trim()).filter(Boolean)
                });
            }

            queue.push(item);
            localStorage.setItem('pending_contributions', JSON.stringify(queue));
            renderQueue();
            document.getElementById('unified-form').reset();
            document.getElementById('complexity-val').textContent = '3';
            notify(`"${item.data.title}" ajouté à la liste.`, 'success');
        }

        // ── Send via Formspree ──────────────────────────────────────
        async function sendViaFormspree() {
            if (queue.length === 0) { notify('La liste est vide — ajoutez des contributions d\'abord.', 'error'); return; }

            const FORMSPREE_ID = 'meenoaez';
            const btn = document.getElementById('formspree-btn');
            const originalText = btn.textContent;

            try {
                btn.textContent = 'Envoi en cours…';
                btn.disabled = true;

                const response = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `Nouvelles contributions de ${window.location.hostname}`,
                        contributions: queue.map(item => item.data)
                    })
                });

                if (response.ok) {
                    notify('Merci ! Vos contributions ont été envoyées.', 'success');
                    clearQueue(true);
                } else {
                    throw new Error('Erreur Formspree');
                }
            } catch (error) {
                notify('Erreur lors de l\'envoi. Utilisez le bouton Export pour conserver vos données.', 'error');
                console.error(error);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // ── Download JSON ───────────────────────────────────────────
        function downloadQueue() {
            if (queue.length === 0) { notify('La liste est vide.', 'error'); return; }
            const dataStr = JSON.stringify(queue.map(item => item.data), null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = `contributions_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link); link.click();
            document.body.removeChild(link); URL.revokeObjectURL(url);
        }

        // ── Render queue ────────────────────────────────────────────
        function renderQueue() {
            const container = document.getElementById('contribution-queue');
            const count = queue.length;
            document.getElementById('queue-count-label').textContent = `Boîte d'envoi (${count})`;

            if (count === 0) {
                container.innerHTML = '<div class="empty-queue">Aucune contribution en attente.</div>';
                return;
            }

            container.innerHTML = [...queue].reverse().map((item, i) => {
                const realIdx = queue.length - 1 - i;
                return `
                <div class="queue-item">
                    <span class="tag">${item.tool}</span>
                    <strong>${item.data.title}</strong>
                    <button class="copy-btn" onclick="copyItem(${realIdx})" aria-label="Copier le JSON de ${item.data.title}">Copier JSON</button>
                    <code>${JSON.stringify(item.data, null, 2)}</code>
                </div>`;
            }).join('');
        }

        function copyItem(index) {
            const text = JSON.stringify(queue[index].data, null, 2);
            navigator.clipboard.writeText(text).then(() => {
                notify('JSON copié dans le presse-papier.', 'success');
            }).catch(() => {
                notify('Impossible de copier — essayez manuellement.', 'error');
            });
        }

        function clearQueue(silent = false) {
            if (!silent) {
                if (!confirm('Vider toute la liste ?')) return;
            }
            queue = [];
            localStorage.setItem('pending_contributions', '[]');
            renderQueue();
            if (!silent) notify('Liste vidée.', 'default');
        }

        renderQueue();
    </script>
</body>

</html>

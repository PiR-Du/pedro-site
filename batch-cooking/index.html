<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assistant Batch Cooking — Pierre Duchesne</title>
  <meta name="description" content="Planifiez plusieurs repas, mutualisez les ingrédients et organisez une session de cuisine efficace." />
  <meta property="og:title" content="Assistant Batch Cooking" />
  <meta property="og:description" content="Générateur de plans de repas pour des sessions de cuisine optimisées." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="../style.css?v=7" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
</head>
<body data-root=".." data-page="batch-cooking">

  <div id="site-header"></div>

  <main>
    <header class="page-header">
      <div class="page-header-inner">
        <div class="page-header-meta">
          <span class="page-header-num">04</span>
          <span class="eyebrow">./batch-cooking</span>
        </div>
        <div class="page-header-rule" aria-hidden="true"></div>
        <h1 class="page-header-title">Organisez votre semaine en un clic.</h1>
        <p class="page-header-lead">Choisissez votre point de départ, nous nous occupons du reste.</p>
      </div>
    </header>

    <div class="batch-container">
      <div class="selector-box">
        <div class="tabs">
          <button class="tab-btn active" data-mode="meal" onclick="setMode('meal')">Partir d'un plat</button>
          <button class="tab-btn" data-mode="ingredient" onclick="setMode('ingredient')">Partir d'un ingrédient</button>
        </div>

        <div class="input-group">
          <label id="select-label">Quel plat vous fait envie ?</label>
          <div id="selectors-container" class="input-group"></div>
        </div>

        <button class="generate-btn" onclick="generatePlan()">Générer ma semaine</button>

        <!-- Formulaire de contribution -->
        <button class="contribute-trigger" onclick="toggleContributePanel('form-batch')" aria-expanded="false" aria-controls="form-batch">
          + Proposer un plat
        </button>

        <div class="contribute-panel" id="form-batch" role="form" aria-label="Proposer un nouveau plat">
          <div class="contribute-panel-header">
            <h4>Proposer un plat</h4>
            <button class="contribute-close-btn" onclick="toggleContributePanel('form-batch')" aria-label="Fermer">×</button>
          </div>

          <div class="cf-field">
            <label for="bf-title">Nom du plat</label>
            <input type="text" id="bf-title" placeholder="ex: Lasagnes bolognaise">
          </div>

          <div class="cf-field">
            <label for="bf-ingredients">Ingrédients principaux <span style="font-weight:400;color:var(--muted-foreground)">(séparés par des virgules)</span></label>
            <textarea id="bf-ingredients" rows="2" placeholder="ex: pâtes, tomates, bœuf, oignons, ail"></textarea>
          </div>

          <button class="cf-submit" onclick="submitBatchMeal()">Proposer ce plat →</button>
          <p class="cf-note">Sauvegardé localement · Pierre intègre les plats manuellement</p>
        </div>
      </div>

      <div id="plan-result" class="plan-grid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../shared-layout.js?v=5"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    function submitBatchMeal() {
      const title = document.getElementById('bf-title').value.trim();
      if (!title) { showToast('Le nom du plat est obligatoire.', 'error'); return; }

      const rawIngredients = document.getElementById('bf-ingredients').value;
      const ingredients = rawIngredients
        .split(',')
        .map(s => s.trim().toLowerCase())
        .filter(Boolean);

      const item = {
        timestamp: new Date().toISOString(),
        tool: 'batch-cooking',
        data: {
          id: Math.floor(Math.random() * 9000) + 1000,
          title,
          ingredients: ingredients.length ? ingredients : ['ingrédients à préciser']
        }
      };

      const stored = JSON.parse(localStorage.getItem('pending_contributions') || '[]');
      stored.push(item);
      localStorage.setItem('pending_contributions', JSON.stringify(stored));

      document.getElementById('bf-title').value = '';
      document.getElementById('bf-ingredients').value = '';
      toggleContributePanel('form-batch');
      showToast('"' + title + '" proposé — merci !', 'success');
    }
  </script>
</body>
</html>

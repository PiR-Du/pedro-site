<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Médiathèque — Pierre Duchesne</title>
  <meta name="description" content="Recommandations de films, séries, livres, musique et jeux — filtrées par ambiance, genre et contributeur." />
  <meta property="og:title" content="La Médiathèque" />
  <meta property="og:description" content="Des recommandations culturelles avec contexte et filtres utiles." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="../style.css?v=7">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
</head>

<body data-page="mediatheque" data-root="..">
  <div id="site-header"></div>

  <main>
    <header class="page-header">
      <div class="page-header-inner">
        <div class="page-header-meta">
          <span class="page-header-num">01</span>
          <span class="eyebrow">./mediatheque</span>
        </div>
        <div class="page-header-rule" aria-hidden="true"></div>
        <h1 class="page-header-title">La Médiathèque</h1>
        <p class="page-header-lead">Films, séries, livres, musique et jeux — recommandés et filtrés.</p>
      </div>
    </header>

    <div class="muse-container">
      <!-- Sidebar -->
      <aside class="muse-sidebar" aria-label="Filtres">
        <div class="filter-group">
          <label for="filter-type">Type de média</label>
          <select class="filter-select" id="filter-type">
            <option value="all">Tout voir</option>
            <option value="Film">Films</option>
            <option value="Série">Séries</option>
            <option value="Livre">Livres</option>
            <option value="Musique">Musique</option>
            <option value="Jeu Vidéo">Jeux Vidéo</option>
            <option value="Jeu de Société">Jeux de Société</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-contributor">Recommandé par</label>
          <select class="filter-select" id="filter-contributor">
            <option value="all">Tout le monde</option>
          </select>
        </div>

        <div class="filter-group hidden-filter" id="filter-group-platform">
          <label for="filter-platform">Plateforme</label>
          <select class="filter-select" id="filter-platform">
            <option value="all">Toutes les plateformes</option>
          </select>
        </div>

        <div id="contextual-filters" class="hidden-filter">
          <div class="filter-group" style="margin-bottom:1.5rem;">
            <label for="filter-genre">Genre</label>
            <select class="filter-select" id="filter-genre">
              <option value="all">Tous les genres</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="filter-ambiance">Ambiance</label>
            <select class="filter-select" id="filter-ambiance">
              <option value="all">Toutes les ambiances</option>
            </select>
          </div>
        </div>

        <!-- Formulaire de recommandation -->
        <button class="contribute-trigger" onclick="toggleContributePanel('form-mediatheque')" aria-expanded="false" aria-controls="form-mediatheque">
          + Recommander un contenu
        </button>

        <div class="contribute-panel" id="form-mediatheque" role="form" aria-label="Ajouter une recommandation">
          <div class="contribute-panel-header">
            <h4>Nouvelle recommandation</h4>
            <button class="contribute-close-btn" onclick="toggleContributePanel('form-mediatheque')" aria-label="Fermer">×</button>
          </div>

          <div class="cf-field">
            <label for="mf-contributor">Votre nom</label>
            <input type="text" id="mf-contributor" placeholder="ex: Pierre">
          </div>

          <div class="cf-field">
            <label for="mf-type">Type</label>
            <select id="mf-type">
              <option value="Film">Film</option>
              <option value="Série">Série</option>
              <option value="Livre">Livre</option>
              <option value="Musique">Musique</option>
              <option value="Jeu Vidéo">Jeu Vidéo</option>
              <option value="Jeu de Société">Jeu de Société</option>
            </select>
          </div>

          <div class="cf-field">
            <label for="mf-title">Titre</label>
            <input type="text" id="mf-title" placeholder="Nom de l'œuvre">
          </div>

          <div class="cf-field">
            <label for="mf-genre">Genre principal</label>
            <input type="text" id="mf-genre" placeholder="ex: SF, Rock, Fantasy…">
          </div>

          <div class="cf-field">
            <label for="mf-ambiance">Ambiance</label>
            <input type="text" id="mf-ambiance" placeholder="ex: Cozy, Dark, Épique…">
          </div>

          <div class="cf-field">
            <label for="mf-pitch">Pitch court</label>
            <textarea id="mf-pitch" placeholder="De quoi s'agit-il ?"></textarea>
          </div>

          <button class="cf-submit" onclick="submitMediaReco()">Ajouter →</button>
          <p class="cf-note">Sauvegardé localement · visible immédiatement</p>
        </div>
      </aside>

      <!-- Grid Content -->
      <div class="grid-content">
        <div style="margin-bottom: 2rem;">
          <label for="media-search" class="sr-only">Rechercher dans la médiathèque</label>
          <input type="search" id="media-search" class="mediatheque-search"
            placeholder="Rechercher un titre, un artiste, un auteur...">
        </div>

        <div class="media-grid" id="main-grid" aria-live="polite" aria-label="Résultats">
        </div>
      </div>
    </div>
  </main>

  <!-- Detail Drawer -->
  <div id="detail-drawer" role="dialog" aria-modal="true" aria-label="Détail" aria-hidden="true">
    <button class="close-drawer" onclick="closeDrawer()" aria-label="Fermer le détail">×</button>
    <div id="drawer-content"></div>
  </div>

  <div id="site-footer"></div>

  <script src="../shared-layout.js?v=5"></script>
  <script src="data.js?v=2"></script>
  <script src="app.js?v=2"></script>
  <script>
    function submitMediaReco() {
      const contributor = document.getElementById('mf-contributor').value.trim() || 'Anonyme';
      const title = document.getElementById('mf-title').value.trim();
      if (!title) { showToast('Le titre est obligatoire.', 'error'); return; }

      const item = {
        id: 'u' + Date.now().toString().slice(-8),
        type: document.getElementById('mf-type').value,
        title,
        contributor,
        main_genre: document.getElementById('mf-genre').value.trim() || 'Divers',
        sub_genres: [],
        main_emotion: '',
        complexity: 3,
        ambiance: document.getElementById('mf-ambiance').value.trim() || '',
        public: 'Solo',
        pitch: document.getElementById('mf-pitch').value.trim(),
        favorite: false
      };

      const stored = JSON.parse(localStorage.getItem('pending_contributions') || '[]');
      stored.push({ timestamp: new Date().toISOString(), tool: 'recommendation', data: item });
      localStorage.setItem('pending_contributions', JSON.stringify(stored));

      ['mf-contributor','mf-title','mf-genre','mf-ambiance','mf-pitch'].forEach(id => {
        document.getElementById(id).value = '';
      });
      toggleContributePanel('form-mediatheque');
      showToast('"' + title + '" ajouté à la médiathèque !', 'success');
      if (typeof initMuse === 'function') initMuse();
    }
  </script>
</body>

</html>

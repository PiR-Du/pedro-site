<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Médiathèque — Pierre Duchesne</title>
  <meta name="description" content="Recommandations de films, séries, livres, musique et jeux — filtrées par ambiance, genre et contributeur." />
  <meta property="og:title" content="La Médiathèque" />
  <meta property="og:description" content="Des recommandations culturelles avec contexte et filtres utiles." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="../style.css?v=3">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
</head>

<body data-page="mediatheque" data-root="..">
  <div id="site-header"></div>

  <main>
    <div class="section-head">
      <p class="eyebrow">./mediatheque</p>
      <h1 class="serif" style="font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.1;">La Médiathèque</h1>
      <p style="color: var(--muted-foreground); margin-top: 0.75rem; max-width: 36rem; text-align: center;">Films, séries, livres, musique et jeux — recommandés et filtrés.</p>
    </div>

    <div class="muse-container">
      <!-- Sidebar -->
      <aside class="muse-sidebar" aria-label="Filtres">
        <div class="filter-group">
          <label for="filter-type">Type de média</label>
          <select class="filter-select" id="filter-type">
            <option value="all">Tout voir</option>
            <option value="Film">Films</option>
            <option value="Série">Séries</option>
            <option value="Livre">Livres</option>
            <option value="Musique">Musique</option>
            <option value="Jeu Vidéo">Jeux Vidéo</option>
            <option value="Jeu de Société">Jeux de Société</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-contributor">Recommandé par</label>
          <select class="filter-select" id="filter-contributor">
            <option value="all">Tout le monde</option>
          </select>
        </div>

        <div class="filter-group hidden-filter" id="filter-group-platform">
          <label for="filter-platform">Plateforme</label>
          <select class="filter-select" id="filter-platform">
            <option value="all">Toutes les plateformes</option>
          </select>
        </div>

        <!-- Contextual Filters -->
        <div id="contextual-filters" class="hidden-filter">
          <div class="filter-group" style="margin-bottom:1.5rem;">
            <label for="filter-genre">Genre</label>
            <select class="filter-select" id="filter-genre">
              <option value="all">Tous les genres</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-ambiance">Ambiance</label>
            <select class="filter-select" id="filter-ambiance">
              <option value="all">Toutes les ambiances</option>
            </select>
          </div>
        </div>
      </aside>

      <!-- Grid Content -->
      <div class="grid-content">
        <div style="margin-bottom: 2rem;">
          <label for="media-search" class="sr-only">Rechercher dans la médiathèque</label>
          <input type="search" id="media-search" class="mediatheque-search"
            placeholder="Rechercher un titre, un artiste, un auteur...">
        </div>

        <div class="media-grid" id="main-grid" aria-live="polite" aria-label="Résultats">
          <!-- Cards injected by app.js -->
        </div>
      </div>
    </div>
  </main>

  <!-- Detail Drawer -->
  <div id="detail-drawer" role="dialog" aria-modal="true" aria-label="Détail" aria-hidden="true">
    <button class="close-drawer" onclick="closeDrawer()" aria-label="Fermer le détail">×</button>
    <div id="drawer-content"></div>
  </div>

  <div id="site-footer"></div>

  <script src="../shared-layout.js?v=3"></script>
  <script src="data.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>

</html>

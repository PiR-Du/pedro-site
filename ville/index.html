<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Que faire en ville ? — Pierre Duchesne</title>
  <meta name="description" content="Sélection de restaurants, bars et lieux de vie testés et approuvés — avec carte interactive et filtres par ambiance." />
  <meta property="og:title" content="Que faire en ville ?" />
  <meta property="og:description" content="Bonnes adresses à Toulouse, Madrid et Paris — filtrées par ambiance, type et budget." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="../style.css?v=7">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body data-page="ville" data-root="..">
  <div id="site-header"></div>

  <main>
    <header class="page-header">
      <div class="page-header-inner">
        <div class="page-header-meta">
          <span class="page-header-num">02</span>
          <span class="eyebrow">./ville</span>
        </div>
        <div class="page-header-rule" aria-hidden="true"></div>
        <h1 class="page-header-title">Que faire ce soir ?</h1>
        <p class="page-header-lead">Restaurants, bars, cafés et lieux de vie — testés et approuvés.</p>
      </div>
    </header>

    <!-- Mood bar -->
    <div class="mood-bar">
      <button class="mood-pill active" data-mood="all">Tout voir</button>
      <button class="mood-pill" data-mood="Entre amis">Entre amis</button>
      <button class="mood-pill" data-mood="Date">Date</button>
      <button class="mood-pill" data-mood="Festif">Festif</button>
      <button class="mood-pill" data-mood="Tranquille">Tranquille</button>
      <button class="mood-pill" data-mood="Brunch">Brunch</button>
      <button class="mood-pill" data-mood="Culture">Culture</button>
    </div>

    <!-- Main layout -->
    <div class="muse-container" style="min-height:auto;align-items:start;">

      <!-- Sidebar -->
      <aside class="muse-sidebar">
        <div class="filter-group">
          <input type="text" id="ville-search" class="ville-search-input" placeholder="Rechercher un lieu...">
        </div>

        <div class="filter-group">
          <label>Ville</label>
          <select class="filter-select" id="filter-city">
            <option value="all">Toutes les villes</option>
            <option value="Toulouse">Toulouse</option>
            <option value="Madrid">Madrid</option>
            <option value="Paris">Paris</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Type de lieu</label>
          <div class="type-pills" id="type-filter"></div>
        </div>

        <div class="ville-count" id="ville-count">— lieux</div>

        <!-- Formulaire de proposition -->
        <button class="contribute-trigger" onclick="toggleContributePanel('form-ville')" aria-expanded="false" aria-controls="form-ville">
          + Proposer un lieu
        </button>

        <div class="contribute-panel" id="form-ville" role="form" aria-label="Proposer un lieu">
          <div class="contribute-panel-header">
            <h4>Proposer un lieu</h4>
            <button class="contribute-close-btn" onclick="toggleContributePanel('form-ville')" aria-label="Fermer">×</button>
          </div>

          <div class="cf-field">
            <label for="vf-contributor">Votre nom</label>
            <input type="text" id="vf-contributor" placeholder="ex: Pierre">
          </div>

          <div class="cf-field">
            <label for="vf-name">Nom du lieu</label>
            <input type="text" id="vf-name" placeholder="ex: Le Perchoir">
          </div>

          <div class="cf-row">
            <div class="cf-field">
              <label for="vf-type">Type</label>
              <select id="vf-type">
                <option value="Restaurant">Restaurant</option>
                <option value="Bar">Bar</option>
                <option value="Café">Café</option>
                <option value="Culture">Culture</option>
                <option value="Autre">Autre</option>
              </select>
            </div>
            <div class="cf-field">
              <label for="vf-city">Ville</label>
              <select id="vf-city">
                <option value="Toulouse">Toulouse</option>
                <option value="Madrid">Madrid</option>
                <option value="Paris">Paris</option>
              </select>
            </div>
          </div>

          <div class="cf-field">
            <label for="vf-neighborhood">Quartier</label>
            <input type="text" id="vf-neighborhood" placeholder="ex: Saint-Pierre, Malasaña…">
          </div>

          <div class="cf-field">
            <label for="vf-description">Description</label>
            <textarea id="vf-description" placeholder="Pourquoi y aller ? Ce qui le rend spécial…"></textarea>
          </div>

          <button class="cf-submit" onclick="submitVilleReco(this)">Proposer →</button>
          <p class="cf-note">Sauvegardé localement · Pierre intègre les suggestions manuellement</p>
        </div>
      </aside>

      <!-- Main content -->
      <div class="ville-main">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
          <div class="ville-view-toggle">
            <button class="view-btn active" id="btn-map" onclick="setView('map')">Carte</button>
            <button class="view-btn" id="btn-list" onclick="setView('list')">Liste</button>
          </div>
          <p style="font-size:0.8rem;color:var(--muted-foreground);">Cliquer sur un lieu pour les détails</p>
        </div>

        <div id="ville-map" class="ville-map"></div>
        <div id="ville-grid" class="ville-grid hidden"></div>
      </div>

    </div>
  </main>

  <!-- Detail Drawer -->
  <div id="detail-drawer">
    <div class="close-drawer" onclick="closeDrawer()">×</div>
    <div id="drawer-content"></div>
  </div>

  <div id="site-footer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../shared-layout.js?v=5"></script>
  <script src="data.js?v=1"></script>
  <script src="app.js?v=1"></script>
  <script>
    async function submitVilleReco(btn) {
      const name = document.getElementById('vf-name').value.trim();
      if (!name) { showToast('Le nom du lieu est obligatoire.', 'error'); return; }

      const item = {
        name,
        type: document.getElementById('vf-type').value,
        city: document.getElementById('vf-city').value,
        neighborhood: document.getElementById('vf-neighborhood').value.trim(),
        description: document.getElementById('vf-description').value.trim(),
        contributor: document.getElementById('vf-contributor').value.trim() || 'Anonyme'
      };

      const ok = await sendContribution('city-guide', item, btn);
      if (!ok) return;

      ['vf-contributor','vf-name','vf-neighborhood','vf-description'].forEach(id => {
        document.getElementById(id).value = '';
      });
      toggleContributePanel('form-ville');
      showToast('"' + name + '" envoyé — merci !', 'success');
    }
  </script>
</body>

</html>
